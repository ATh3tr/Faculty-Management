services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${FACULTY_DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - faculty_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FacultyDatabase: "Server=database,1433;Database=FacultyManagement;User Id=sa;Password=${FACULTY_DB_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__SigningKey: ${FACULTY_JWT_SIGNING_KEY}
      Cors__AllowedOrigins__0: ${FACULTY_REACT_ORIGIN}
      Database__SeedOnStartup: "true"
      SeedAdmin__Email: ${FACULTY_ADMIN_EMAIL}
      SeedAdmin__Password: ${FACULTY_ADMIN_PASSWORD}
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: FacultyManagement.Web/Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  faculty_sql_data:
